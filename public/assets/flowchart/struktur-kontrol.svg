<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Tiga diagram: Sequence kotak berurutan, Branching diamond bercabang, Looping diamond dengan panah kembali">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b" text-anchor="middle">

    <!-- ===== SEQUENCE ===== -->
    <text x="110" y="26" font-size="14" font-weight="700">Sequence</text>
    <rect x="50" y="46" width="120" height="34" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="110" y="68">Start</text>
    <line x1="110" y1="80" x2="110" y2="104" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="50" y="108" width="120" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="130">Proses 1</text>
    <line x1="110" y1="142" x2="110" y2="166" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="50" y="170" width="120" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="192">Proses 2</text>
    <line x1="110" y1="204" x2="110" y2="228" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="50" y="232" width="120" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="254">Proses 3</text>
    <line x1="110" y1="266" x2="110" y2="290" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="50" y="294" width="120" height="32" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="110" y="315">End</text>

    <!-- ===== BRANCHING ===== -->
    <text x="450" y="26" font-size="14" font-weight="700">Branching</text>
    <rect x="390" y="46" width="120" height="34" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="68">Start</text>
    <line x1="450" y1="80" x2="450" y2="108" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <polygon points="450,112 530,152 450,192 370,152" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="450" y="157">kondisi?</text>
    <line x1="530" y1="152" x2="626" y2="152" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="574" y="144" font-size="11" fill="#15803d">Ya</text>
    <rect x="630" y="134" width="120" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="690" y="156">Aksi A</text>
    <line x1="450" y1="192" x2="450" y2="228" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="461" y="214" font-size="11" fill="#b91c1c" text-anchor="start">Tidak</text>
    <rect x="390" y="232" width="120" height="34" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="450" y="254">Aksi B</text>
    <line x1="690" y1="168" x2="690" y2="290" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="690" y1="290" x2="516" y2="290" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="450" y1="266" x2="450" y2="290" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="450" y1="290" x2="450" y2="294" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="390" y="294" width="120" height="32" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="450" y="315">End</text>

    <!-- ===== LOOPING ===== -->
    <text x="790" y="26" font-size="14" font-weight="700">Looping</text>
    <rect x="730" y="46" width="120" height="34" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="790" y="68">Start</text>
    <line x1="790" y1="80" x2="790" y2="104" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <rect x="730" y="108" width="120" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="790" y="130">Proses</text>
    <line x1="790" y1="142" x2="790" y2="168" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <polygon points="790,172 862,212 790,252 718,212" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="790" y="217">kondisi?</text>
    <line x1="790" y1="252" x2="790" y2="290" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="801" y="274" font-size="11" fill="#b91c1c" text-anchor="start">Tidak</text>
    <rect x="730" y="294" width="120" height="32" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="790" y="315">End</text>
    <!-- panah kembali -->
    <path d="M718,212 L664,212 L664,125 L726,125" fill="none" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#a2)"/>
    <text x="676" y="204" font-size="11" fill="#15803d" text-anchor="end">Ya</text>
  </g>
</svg>
