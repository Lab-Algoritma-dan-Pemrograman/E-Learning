<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Flowchart sederhana: Start, Input nilai, Decision nilai >= 60, Output Lulus atau Tidak Lulus, End">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#18181b" text-anchor="middle">

    <!-- Start -->
    <rect x="300" y="18" width="120" height="40" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="360" y="43">Start</text>
    <line x1="360" y1="58" x2="360" y2="92" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- Input / Proses -->
    <polygon points="300,96 420,96 440,136 280,136" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="360" y="121">Input: nilai</text>
    <line x1="360" y1="136" x2="360" y2="166" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- Decision -->
    <polygon points="360,170 470,215 360,260 250,215" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="360" y="211">nilai &gt;= 60?</text>
    <text x="360" y="229" font-size="11" fill="#71717a">Decision</text>

    <!-- Ya -> kanan -->
    <line x1="470" y1="215" x2="548" y2="215" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="509" y="207" font-size="11" fill="#15803d">Ya</text>
    <rect x="552" y="195" width="140" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="622" y="220">Output: "Lulus"</text>
    <line x1="622" y1="235" x2="622" y2="272" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah)"/>

    <!-- Tidak -> bawah -->
    <line x1="360" y1="260" x2="360" y2="272" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah)"/>
    <text x="371" y="286" font-size="11" fill="#b91c1c" text-anchor="start">Tidak</text>
    <rect x="290" y="272" width="140" height="38" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="360" y="296" font-size="12">Output: "Tidak Lulus"</text>

    <!-- End -->
    <line x1="622" y1="272" x2="550" y2="315" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="360" y1="310" x2="550" y2="315" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="520" y="300" width="100" height="36" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="323">End</text>
  </g>
</svg>
