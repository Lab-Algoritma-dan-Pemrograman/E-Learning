<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Terminal (Mulai) -->
  <rect x="70" y="20" width="100" height="30" rx="15" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="35" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Mulai</text>
  <line x1="120" y1="50" x2="120" y2="80" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process 1 -->
  <rect x="70" y="80" width="100" height="40" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="100" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">Inisialisasi</text>
  <line x1="120" y1="120" x2="120" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision (Kondisi) -->
  <polygon points="120,150 170,175 120,200 70,175" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="175" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle">Kondisi?</text>
  
  <!-- Arrow Right dari Decision -->
  <line x1="170" y1="175" x2="210" y2="175" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="black">Tidak</text>
  
  <!-- Arrow Down dari Decision -->
  <line x1="120" y1="200" x2="120" y2="240" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="225" font-family="Arial" font-size="10" text-anchor="start" fill="black">Ya</text>

  <!-- Output/Dokumen (Kanan) -->
  <path d="M 210 160 L 290 160 L 290 200 Q 270 215 250 195 T 210 200 Z" fill="white" stroke="black" stroke-width="2"/>
  <text x="250" y="180" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle">Cetak Peringatan</text>
  
  <!-- Jalur dari Dokumen kembali ke bawah -->
  <polyline points="250,205 250,295 130,295" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process 2 (Bawah Decision) -->
  <rect x="70" y="240" width="100" height="40" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="260" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle">Proses Data</text>
  
  <!-- Jalur dari Process 2 ke Terminal -->
  <line x1="120" y1="280" x2="120" y2="330" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Terminal (Selesai) -->
  <rect x="70" y="330" width="100" height="30" rx="15" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="345" font-family="Arial" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Selesai</text>
</svg>
