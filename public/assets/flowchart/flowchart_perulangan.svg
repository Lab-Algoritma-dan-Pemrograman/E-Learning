<svg width="250" height="380" viewBox="0 0 250 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Terminal (Mulai) -->
  <rect x="80" y="20" width="80" height="25" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="32.5" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Mulai</text>
  <line x1="120" y1="45" x2="120" y2="80" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="120,80 160,105 120,130 80,105" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="105" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle">Kondisi</text>
  
  <!-- Arrow Right dari Decision (keluar loop) -->
  <polyline points="160,105 220,105 220,320 150,320" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="100" font-family="Arial" font-size="10" text-anchor="middle" fill="black">Tidak</text>
  
  <!-- Arrow Down dari Decision (masuk loop) -->
  <line x1="120" y1="130" x2="120" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="150" font-family="Arial" font-size="10" text-anchor="start" fill="black">Ya</text>

  <!-- Process 1 -->
  <rect x="90" y="170" width="60" height="35" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="187.5" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle">Proses</text>
  <line x1="120" y1="205" x2="120" y2="245" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Process 2 -->
  <rect x="90" y="245" width="60" height="35" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="262.5" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle">Update</text>
  
  <!-- Garis kembali ke atas (looping) -->
  <polyline points="90,262 40,262 40,65 120,65" fill="none" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Terminal (Selesai) -->
  <rect x="90" y="305" width="60" height="30" rx="15" fill="white" stroke="black" stroke-width="2"/>
  <text x="120" y="320" font-family="Arial" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Selesai</text>
</svg>
